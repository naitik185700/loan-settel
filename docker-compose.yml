version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settle_loan_expert_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://settle_admin:SuperSecretPassword2026@postgres:5432/settle_loan_expert?schema=public
      - JWT_SECRET=settle_loan_expert_super_secure_jwt_secret_token_key_2026_xyz
      - NEXT_PUBLIC_APP_URL=https://settleloanexpert.in
      - NEXT_PUBLIC_COMPANY_NAME=Settle Loan Expert
      - NEXT_PUBLIC_PHONE=+91 88609 41586
      - NEXT_PUBLIC_EMAIL=support@settleloanexpert.in
      - NEXT_PUBLIC_ZOHO_FORM_URL=https://forms.zohopublic.in/rddslegalsolutionsopcprivatel1/form/InquiryForm/formperma/HyvqgErILmK-RGLlxZhGBqi2leGDhXEjXaAgyI5RegI
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - settle_network

  postgres:
    image: postgres:16-alpine
    container_name: settle_loan_expert_db
    restart: always
    environment:
      POSTGRES_USER: settle_admin
      POSTGRES_PASSWORD: SuperSecretPassword2026
      POSTGRES_DB: settle_loan_expert
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle_admin -d settle_loan_expert"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - settle_network

networks:
  settle_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
